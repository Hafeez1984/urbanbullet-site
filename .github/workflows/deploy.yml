name: Build & Deploy to Hostinger

on:
  push:
    branches:
      - main

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📦 Install Dependencies
        run: npm install

      - name: 🛠️ Build Static Frontend
        run: npm run build

      - name: 🚀 Push to Hostinger via Secure Copy
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 145.79.213.22
          username: u320819004
          password: ${{ secrets.HOSTINGER_PASSWORD }}
          port: 65002
          source: "out/*"
          target: "domains/urbanbullet.in/public_html"
          strip_components: 1
